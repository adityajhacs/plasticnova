<!DOCTYPE html>
<html>
<head>
<title>Learn - Plastic Nova</title>

<style>

body{
  margin:0;
  font-family:'Segoe UI';
  background: linear-gradient(135deg,#5eef51,#203a43,#3aa468);
  color:white;
}

/* HEADER */
.header{
  text-align:center;
  padding:25px;
  font-size:26px;
  font-weight:bold;
}

/* UPLOAD BOX */
.upload-box{
  text-align:center;
  margin:20px;
}

.upload-box input{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
  width:200px;
}

.upload-box button{
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:#00c853;
  color:white;
  cursor:pointer;
}

/* GRID */
.video-container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
  padding:20px;
}

/* CARD */
.video-card{
  background:rgba(255,255,255,0.08);
  border-radius:20px;
  overflow:hidden;
  backdrop-filter:blur(10px);
  box-shadow:0 0 20px rgba(0,255,204,0.3);
  transition:0.3s;
  position:relative;
  cursor:pointer;
}

.video-card:hover{
  transform:scale(1.03);
}

/* IMAGE */
.video-card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

/* PLAY BUTTON */
.play-btn{
  position:absolute;
  top:35%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:40px;
  background:rgba(0,0,0,0.6);
  padding:10px 18px;
  border-radius:50%;
}

/* TEXT */
.video-card h3{
  padding:10px;
}

.video-card p{
  padding:0 10px 15px;
  font-size:14px;
  opacity:0.8;
}

</style>
</head>

<body>

<div class="header">
  🎥 Learn & Create from Waste
</div>

<!-- UPLOAD SECTION -->
<div class="upload-box">
  <input type="text" id="videoLink" placeholder="Paste YouTube link">
  <input type="text" id="videoTitle" placeholder="Enter title">
  <button onclick="addYTVideo()">Upload Video</button>
</div>

<!-- VIDEO GRID -->
<div class="video-container">

  <div class="video-card" onclick="playVideo(this,'NMkhWwdAzSw')">
    <img src="https://img.youtube.com/vi/NMkhWwdAzSw/hqdefault.jpg">
    <div class="play-btn">▶</div>
    <h3>Creative Waste Idea</h3>
    <p>Reuse plastic creatively</p>
  </div>

  <div class="video-card" onclick="playVideo(this,'uYYZTMjE9pA')">
    <img src="https://img.youtube.com/vi/uYYZTMjE9pA/hqdefault.jpg">
    <div class="play-btn">▶</div>
    <h3>Plastic Reuse Trick</h3>
    <p>Make useful items</p>
  </div>

  <div class="video-card" onclick="playVideo(this,'WsZ_1FXsYOs')">
    <img src="https://img.youtube.com/vi/WsZ_1FXsYOs/hqdefault.jpg">
    <div class="play-btn">▶</div>
    <h3>DIY Eco Product</h3>
    <p>Create eco items</p>
  </div>

  <div class="video-card" onclick="playVideo(this,'kiO4VyuAqeI')">
    <img src="https://img.youtube.com/vi/kiO4VyuAqeI/hqdefault.jpg">
    <div class="play-btn">▶</div>
    <h3>Smart Recycling</h3>
    <p>Reuse waste smartly</p>
  </div>

  <div class="video-card" onclick="playVideo(this,'jjo9xwKSQHU')">
    <img src="https://img.youtube.com/vi/jjo9xwKSQHU/hqdefault.jpg">
    <div class="play-btn">▶</div>
    <h3>Daily Waste Hack</h3>
    <p>Easy reuse ideas</p>
  </div>

</div>

<script>

// PLAY VIDEO
function playVideo(card,id){
  card.innerHTML = `
    <iframe 
      width="100%" 
      height="200"
      src="https://www.youtube.com/embed/${id}?autoplay=1"
      frameborder="0"
      allowfullscreen>
    </iframe>
  `;
}

// ADD YOUTUBE VIDEO
function addYTVideo(){

  let link = document.getElementById("videoLink").value;
  let title = document.getElementById("videoTitle").value;

  if(!link || !title){
    alert("Fill all fields!");
    return;
  }

  let id;

  if(link.includes("watch?v=")){
    id = link.split("watch?v=")[1];
  } else if(link.includes("shorts/")){
    id = link.split("shorts/")[1];
  } else {
    alert("Invalid link!");
    return;
  }

  id = id.split("?")[0];

  const container = document.querySelector(".video-container");

  const card = document.createElement("div");
  card.className = "video-card";

  card.innerHTML = `
    <img src="https://img.youtube.com/vi/${id}/hqdefault.jpg">
    <div class="play-btn">▶</div>
    <h3>${title}</h3>
    <p>User added tutorial</p>
  `;

  card.onclick = function(){
    playVideo(card,id);
  };

  container.prepend(card);

  document.getElementById("videoLink").value="";
  document.getElementById("videoTitle").value="";
}

</script>

</body>
</html>
