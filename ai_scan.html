<!DOCTYPE html>
<html>
<head>
<title>AI Waste Scanner</title>

<style>

/* BACKGROUND */
body{
  margin:0;
  font-family:'Segoe UI';
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;

  background: linear-gradient(270deg,#0f2027,#203a43,#2c5364,#00c853);
  background-size:800% 800%;
  animation:bgMove 10s ease infinite;
  color:white;
}

/* MAIN CONTAINER */
.container{
  width:90%;
  max-width:900px;
  display:flex;
  gap:20px;

  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border-radius:20px;
  padding:20px;

  box-shadow:0 0 40px rgba(0,255,204,0.4);
}

/* LEFT (IMAGE) */
.left{
  flex:1;
  text-align:center;
}

.left img{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:15px;
}

/* RIGHT (RESULT) */
.right{
  flex:1;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#00c853,#00ffcc);
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

/* RESULT */
.result{
  margin-top:15px;
  background:rgba(255,255,255,0.1);
  padding:15px;
  border-radius:15px;
}

/* ANIMATION */
@keyframes bgMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* MOBILE */
@media(max-width:768px){
  .container{
    flex-direction:column;
  }
}

</style>
</head>

<body>

<div class="container">

  <!-- LEFT SIDE -->
  <div class="left">
    <h2>📸 Upload Image</h2>
    <input type="file" id="img">
    <img id="preview" style="display:none;">
  </div>

  <!-- RIGHT SIDE -->
  <div class="right">
    <h2>🤖 AI Scanner</h2>

    <button onclick="scanWaste()">Scan with AI</button>

    <div id="result" class="result"></div>
  </div>

</div>

<script>

// IMAGE PREVIEW
document.getElementById("img").addEventListener("change", function(e){
  const file = e.target.files[0];
  const preview = document.getElementById("preview");

  if(file){
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  }
});

// SCAN FUNCTION
function scanWaste(){

  let file = document.getElementById("img").files[0];
  if(!file){
    alert("Select image first!");
    return;
  }

  let result = document.getElementById("result");

  result.innerHTML = "🤖 Scanning...";

  let data = [
    {
      type:"Plastic Bottle",
      harm:"Medium 🟡",
      years:"450 years",
      pollution:"Harms marine life",
      price:20,
      recycle:"Recyclable ♻️",
      action:"Sell to recycler",
      eco:"⭐⭐⭐"
    },
    {
      type:"Polythene Bag",
      harm:"Very High 🔴",
      years:"1000 years",
      pollution:"Blocks drainage & harms animals",
      price:10,
      recycle:"Difficult ❌",
      action:"Avoid usage",
      eco:"⭐"
    },
    {
      type:"Hard Plastic",
      harm:"Low 🟢",
      years:"200 years",
      pollution:"Non-biodegradable",
      price:35,
      recycle:"Recyclable ♻️",
      action:"Reuse or sell",
      eco:"⭐⭐⭐⭐"
    }
  ];

  setTimeout(()=>{

    let d = data[Math.floor(Math.random()*data.length)];

    result.innerHTML = `
      <h3>♻ AI Analysis</h3>

      <p><b>Type:</b> ${d.type}</p>
      <p><b>Harm:</b> ${d.harm}</p>
      <p><b>Decomposition:</b> ${d.years}</p>
      <p><b>Pollution:</b> ${d.pollution}</p>

      <hr>

      <p><b>Price:</b> ₹${d.price}/kg</p>
      <p><b>Total:</b> ₹${d.price}</p>

      <hr>

      <p><b>Recycle:</b> ${d.recycle}</p>
      <p><b>Action:</b> ${d.action}</p>
      <p><b>Eco Score:</b> ${d.eco}</p>

      <button onclick="sellNow('${d.type}', ${d.price})">
        💰 Sell Now
      </button>
    `;

  },1500);
}

// SELL FUNCTION
function sellNow(type, price){

  let waste = {
    material:type,
    qty:1,
    pricePerKg:price,
    total:price
  };

  let wastes = JSON.parse(localStorage.getItem("wastes")) || [];
  wastes.push(waste);

  localStorage.setItem("wastes", JSON.stringify(wastes));

  alert("Added to Marketplace 🚀");

  window.location.href = "marketplace.html";
}

</script>

</body>
</html>
