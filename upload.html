<!DOCTYPE html>
<html>
<head>
  <title>Upload Waste</title>
  <style>
 
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f6fff7;
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 220px;
  height: 100%;
  background: linear-gradient(180deg, #2e7d32, #1b5e20);
  padding: 20px;
  color: white;
}

.sidebar h2 {
  margin-bottom: 25px;
}

.sidebar a {
  display: block;
  margin: 12px 0;
  color: white;
  text-decoration: none;
  font-size: 15px;
  transition: 0.3s;
}

.sidebar a:hover {
  transform: translateX(5px);
  opacity: 0.8;
}

/* MAIN */
.main {
  margin-left: 220px;
  padding: 40px;
  display: flex;
  justify-content: center;
}

/* UPLOAD CARD */
.upload-container {
  width: 700px;
  padding: 40px;
  border-radius: 25px;

  background: linear-gradient(135deg, #e8f5e9, #c8e6c9);

  box-shadow:
    0 10px 40px rgba(0,0,0,0.15),
    inset 0 0 20px rgba(255,255,255,0.4);

  position: relative;
  overflow: hidden;
  animation: fadeIn 0.8s ease;
}

/* GLOW EFFECT */
.upload-container::before {
  content: "";
  position: absolute;
  width: 300px;
  height: 300px;
  background: rgba(76, 175, 80, 0.3);
  border-radius: 50%;
  top: -100px;
  right: -100px;
  filter: blur(80px);
}

/* TITLE */
.upload-container h2 {
  text-align: center;
  margin-bottom: 30px;
  font-size: 26px;
  color: #1b5e20;
}

/* GRID */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.full {
  grid-column: span 2;
}

/* INPUTS */
.upload-container input,
.upload-container select {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(5px);
  font-size: 14px;
  outline: none;
  transition: 0.2s;
}

.upload-container input:focus,
.upload-container select:focus {
  transform: scale(1.02);
}

/* IMAGE */
#preview {
  width: 100%;
  border-radius: 12px;
  margin-top: 10px;
  display: none;
}

/* BUTTON */
.upload-container button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;

  background: linear-gradient(135deg, #2e7d32, #43a047);
  color: white;

  cursor: pointer;
  transition: 0.3s;
}

.upload-container button:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* PRICE BOX */
#priceResult {
  background: linear-gradient(135deg, #a5d6a7, #81c784);
  padding: 15px;
  border-radius: 12px;
  margin-top: 10px;
  font-weight: bold;
  color: #1b5e20;
}

/* LOCATION */
#locationText {
  font-size: 14px;
  margin-top: 5px;
  color: #2e7d32;
}

/* ANIMATION */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* RESPONSIVE */
@media (max-width: 768px) {

  .main {
    margin-left: 0;
    padding: 20px;
  }

  .sidebar {
    display: none;
  }

  .upload-container {
    width: 100%;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: span 1;
  }
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>♻ Nova</h2>
  <a href="../index.html">🏠 Home</a>
  <a href="upload.html">📤 Upload</a>
  <a href="marketplace.html">🛍 <span>Market</span></a>
  <a href="dashboard.html">📊 <span>Dashboard</span></a>
   <a href="buyers.html">🤝 Buyers</a>
   <a href="tutorial.html">🎥 Tutorial</a>
   <a href="schedule.html">⏰ <span>Schedule</span></a>
   <a href="ngo.html">🌱 <span>NGO Form</span></a>
   <a href="quiz.html">♻️ Quiz</a>
  <a href="profile.html">👤 My Profile</a>
</div>

<!-- MAIN -->
<div class="main">

  <div class="upload-container">

    <h2>📤 Sell Your Waste</h2>

    <div class="form-grid">

      <!-- IMAGE -->
      <div class="full">
        <input type="file" id="imageInput" accept="image/*">
        <img id="preview">
      </div>

      <!-- MATERIAL -->
     
<div class="full">
  <input list="materials" id="material" placeholder="Select or type material">
  <datalist id="materials">
          <option value="Plastic Bottle">
          <option value="Polythene">
          <option value="Hard Plastic">
          <option value="Plastic Bags">
        </datalist>
</div>

<!-- QUALITY -->
<div class="full">
  <select id="quality">
    <option value="10">Low Quality</option>
    <option value="20">Medium Quality</option>
    <option value="30">High Quality</option>
  </select>
</div>

      <!-- QUANTITY -->
      <div class="full">
        <input type="number" id="quantity" placeholder="Quantity (kg)">
      </div>

      <!-- LOCATION -->
      <div class="full">
        <button onclick="getLocation()">📍 Get Location</button>
        <p id="locationText"></p>
      </div>

      <!-- PRICE -->
      <div class="full">
        <button onclick="calculatePrice()">💰 Calculate Price</button>
        <div id="priceResult"></div>
      </div>

      <!-- SUBMIT -->
      <div class="full">
        <button onclick="submitWaste()">🚀 List for Sale</button>
      </div>

    </div>

  </div>

</div>

<script>

  // IMAGE PREVIEW
  document.getElementById("imageInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    const preview = document.getElementById("preview");

    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    }
  });

  // LOCATION
  function getLocation() {
    navigator.geolocation.getCurrentPosition(pos => {
      document.getElementById("locationText").innerText =
        `📍 ${pos.coords.latitude.toFixed(3)}, ${pos.coords.longitude.toFixed(3)}`;
    });
  }

  // PRICE
  function calculatePrice() {
    const qty = document.getElementById("quantity").value;
    const price = document.getElementById("quality").value;

    if (!qty) return alert("Enter quantity");

    const total = qty * price;

    document.getElementById("priceResult").innerHTML =
      `💰 ₹${price}/kg <br>Total: ₹${total}`;
  }

  // SUBMIT
  function submitWaste() {
    const material = document.getElementById("material").value;
    const qty = document.getElementById("quantity").value;
    const price = document.getElementById("quality").value;

    if (!material || !qty) return alert("Fill all details");

    const total = qty * price;

    localStorage.setItem("waste", JSON.stringify({
      material, qty, pricePerKg: price, total
    }));

    alert("Listed Successfully 🚀");
  }

</script>

</body>
</html>
